[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeitghost"
version = "0.1.0"
description = "National news with bias analysis and dual L/R variants — spiritwriter-powered static site"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Aaron Markham"},
]
dependencies = [
    "spiritwriter>=0.9.0",
    "anthropic>=0.40.0",
    "requests>=2.31",
    "jinja2>=3.1",
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "trafilatura>=2.0",
]

[project.scripts]
zeitghost = "zeitghost.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0"]
legacy = ["psycopg2-binary>=2.9"]

[tool.setuptools.packages.find]
include = ["zeitghost*"]
