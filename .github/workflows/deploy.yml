###############################################################################
# Zeitghost Deploy Pipeline
#
# Flow: test → build wheel → deploy to target node → health check
#
# Auto-runs on push to main; manual workflow_dispatch is also available
# (useful while we're still nailing things down on us-ny1).
#
# Uses Tailscale GitHub Action to join the mesh, then Ansible over Tailscale.
###############################################################################
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sw_core_ref:
        description: 'spiritwriter-core branch/tag/sha to build wheel from'
        default: 'main'
      target:
        description: 'Ansible inventory to deploy (e.g. us-ny1)'
        default: 'us-ny1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: aaronmarkham/spiritwriter-core
          ref: ${{ inputs.sw_core_ref || 'main' }}
          token: ${{ secrets.SW_CORE_PAT }}
          path: spiritwriter-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          pip install ./spiritwriter-core
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Verify clean-cwd import (production container parity)
        run: |
          mkdir -p /tmp/clean-import-test
          cd /tmp/clean-import-test
          python -c "import zeitghost; from zeitghost.cli import main; print('ok')"

  build-wheel:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: aaronmarkham/spiritwriter-core
          ref: ${{ inputs.sw_core_ref || 'main' }}
          token: ${{ secrets.SW_CORE_PAT }}
          path: spiritwriter-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          rm -f infra/docker/wheels/spiritwriter-*.whl
          pip wheel ./spiritwriter-core --no-deps -w infra/docker/wheels/

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: infra/docker/wheels/*.whl

  deploy:
    needs: build-wheel
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: infra/docker/wheels/

      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "Host *" > ~/.ssh/config
          echo "  IdentityFile ~/.ssh/id_deploy" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible

      - name: Deploy
        working-directory: infra/ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"
          # Per-node identity — the inventory reads these via lookup('env', ...)
          # so the committed file carries no real host/user. DEPLOY_USER falls
          # back to "deploy" in the inventory if unset.
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          VAULT_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VAULT_NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          # Ed25519 shard-signing seed (64 hex chars). Set the repo secret with
          # `gh secret set ZEITGHOST_SIGNING_KEY`. Empty until then — env.j2
          # defaults it to '' so the deploy renders and ingest stays unsigned.
          VAULT_ZEITGHOST_SIGNING_KEY: ${{ secrets.ZEITGHOST_SIGNING_KEY }}
        run: |
          TARGET="${{ inputs.target || 'us-ny1' }}"
          ansible-playbook deploy.yml \
            -i "inventories/${TARGET}/hosts.yml" \
            -e "vault_anthropic_api_key=${VAULT_ANTHROPIC_API_KEY}" \
            -e "vault_news_api_key=${VAULT_NEWS_API_KEY}" \
            -e "vault_zeitghost_signing_key=${VAULT_ZEITGHOST_SIGNING_KEY}" \
            -e "zeitghost_commit_sha=${{ github.sha }}"

      - name: Health check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # Give the builder a moment to render the initial site
          sleep 10
          for i in $(seq 1 10); do
            RESP=$(curl -sf "http://${DEPLOY_HOST}/healthz" 2>/dev/null || echo "")
            if echo "$RESP" | grep -q "ok"; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: waiting for nginx..."
            sleep 5
          done
          echo "WARNING: Health check didn't pass — first ingest may still be running"
          # Don't fail — initial Claude analysis takes time
