# US-NY1 inventory — Ubuntu, Tailscale-meshed, serves news.spiritwriter.ai.
#
# Update ansible_host to the node's Tailscale IP once it's joined the mesh.
# Zeitghost is the primary tenant; frio scraping services may be added later
# (the frionode user choice keeps that door open).
all:
  children:
    core:
      hosts:
        us-ny1:
          ansible_host: 100.120.169.33
          zeitghost_nginx_port: 80
          zeitghost_domain: news.spiritwriter.ai
          # Bind-mount shard store to host for backup / rsync access
          zeitghost_host_shards: /home/frionode/.zeitghost/shards

  vars:
    ansible_user: frionode
    zeitghost_env: production
    zeitghost_deploy_root: /home/frionode/zeitghost-docker
