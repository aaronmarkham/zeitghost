# US-NY1 inventory — Ubuntu, Tailscale-meshed, serves news.spiritwriter.ai.
#
# Per-node identity is read from the environment so it can live in CI secrets
# instead of in this committed file:
#   DEPLOY_HOST  — the node's Tailscale IP (required; set as a GitHub secret)
#   DEPLOY_USER  — the deploy user on the node (defaults to "deploy")
# For a local run, export both before invoking ansible-playbook, e.g.
#   DEPLOY_HOST=100.x.y.z DEPLOY_USER=deploy ansible-playbook deploy.yml -i ...
# Zeitghost is the primary tenant; frio scraping services may be added later.
all:
  children:
    core:
      hosts:
        us-ny1:
          ansible_host: "{{ lookup('env', 'DEPLOY_HOST') }}"
          zeitghost_nginx_port: 80
          zeitghost_domain: news.spiritwriter.ai
          # Bind-mount shard store to host for backup / rsync access
          zeitghost_host_shards: "/home/{{ ansible_user }}/.zeitghost/shards"

  vars:
    ansible_user: "{{ lookup('env', 'DEPLOY_USER') | default('deploy', true) }}"
    zeitghost_env: production
    zeitghost_deploy_root: "/home/{{ ansible_user }}/zeitghost-docker"
