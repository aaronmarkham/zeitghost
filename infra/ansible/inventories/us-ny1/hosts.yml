# US-NY1 inventory — Ubuntu, Tailscale-meshed, serves news.spiritwriter.ai.
#
# Update ansible_host to the node's Tailscale IP once it's joined the mesh.
# The frio scraper does NOT run on this host; this is zeitghost-only.
all:
  children:
    core:
      hosts:
        us-ny1:
          # FIXME: replace with actual Tailscale IP for us-ny1
          ansible_host: 100.0.0.0
          zeitghost_nginx_port: 80
          zeitghost_domain: news.spiritwriter.ai
          # Bind-mount shard store to host for backup / rsync access
          zeitghost_host_shards: /home/zeitghost/.zeitghost/shards

  vars:
    # FIXME: confirm SSH user on us-ny1; texascrime.org uses 'frionode'
    ansible_user: zeitghost
    zeitghost_env: production
    zeitghost_deploy_root: /home/zeitghost/zeitghost-docker
