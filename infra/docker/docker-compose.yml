###############################################################################
# Zeitghost Node Stack — news.spiritwriter.ai
#
# Public-facing static news site (port 80). TLS handled by Cloudflare proxy.
#
# Usage:
#   ./build-wheels.sh
#   echo "ANTHROPIC_API_KEY=..." > .env
#   echo "NEWS_API_KEY=..."     >> .env
#   docker compose up -d
###############################################################################

services:
  init-data:
    image: python:3.12-slim
    container_name: zeitghost-init
    volumes:
      - site-data:/output
      # Must reference the SAME source as builder so that when
      # ZEITGHOST_HOST_SHARDS points at a host bind mount, init-data
      # chowns the actual storage builder will write to.
      - ${ZEITGHOST_HOST_SHARDS:-shard-data}:/shards
    entrypoint: ["sh", "-c", "chown -R 1000:1000 /output /shards"]

  builder:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.builder
    container_name: zeitghost-builder
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      # Shard signing — seed (secret) + fail-closed switch. Values live in .env
      # (rendered 0600 by Ansible from the vault); only the references are here.
      ZEITGHOST_SIGNING_KEY: ${ZEITGHOST_SIGNING_KEY:-}
      ZEITGHOST_REQUIRE_SIGNING: ${ZEITGHOST_REQUIRE_SIGNING:-0}
      ZEITGHOST_FEEDS: ${ZEITGHOST_FEEDS:-feeds/newsapi.yaml}
      ZEITGHOST_INTERVAL: ${ZEITGHOST_INTERVAL:-3600}
      ZEITGHOST_INGEST_LIMIT: ${ZEITGHOST_INGEST_LIMIT:-50}
      ZEITGHOST_MAX_REQUESTS: ${ZEITGHOST_MAX_REQUESTS:-2}
    volumes:
      - site-data:/output
      - ${ZEITGHOST_HOST_SHARDS:-shard-data}:/home/zeitghost/data/shards
    depends_on:
      init-data:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    container_name: zeitghost-nginx
    restart: unless-stopped
    volumes:
      - site-data:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${ZEITGHOST_PORT:-80}:80"
    depends_on:
      - builder
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  site-data:
  shard-data:
