# Landing page for spiritwriter.ai + www.spiritwriter.ai — the OSS library's
# marketing site. Same docroot as news.spiritwriter.ai so static assets
# (favicon, etc.) are reachable from the same volume, but every URL serves
# /landing.html.
server {
    listen 80;
    server_name spiritwriter.ai www.spiritwriter.ai;

    root /usr/share/nginx/html;

    # Static assets need to pass through so the landing page can load
    # its favicon and any future CSS/images.
    location /static/ {
        try_files $uri =404;
    }
    location = /favicon.ico {
        alias /usr/share/nginx/html/static/favicon.ico;
        access_log off;
        log_not_found off;
        expires 7d;
    }

    # Everything else gets the landing page.
    location / {
        try_files /landing.html =404;
    }

    location /healthz {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}

# News site — news.spiritwriter.ai (and the raw IP / catch-all default).
server {
    listen 80 default_server;
    server_name news.spiritwriter.ai _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Browsers auto-fetch /favicon.ico from the root regardless of <link rel>
    location = /favicon.ico {
        alias /usr/share/nginx/html/static/favicon.ico;
        access_log off;
        log_not_found off;
        expires 7d;
    }

    location /healthz {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
